<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>রাজাকার নিধন</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }
        
        /* Modern Glass UI Menu */
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, rgba(20,20,20,0.9) 0%, rgba(0,0,0,0.95) 100%);
            z-index: 10; backdrop-filter: blur(5px); transition: opacity 0.3s ease;
        }
        #menu h1 { 
            font-size: 48px; color: #ff4444; margin-bottom: 10px; 
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5); text-align: center; letter-spacing: 2px;
        }
        #menu p { color: #aaa; margin-bottom: 40px; font-size: 18px; }
        
        .btn {
            background: rgba(255, 255, 255, 0.05); color: white; border: 1px solid rgba(255,255,255,0.2); 
            padding: 15px 40px; font-size: 20px; margin: 10px; cursor: pointer; 
            border-radius: 8px; width: 220px; font-weight: bold; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: all 0.2s ease;
        }
        .btn:active { transform: scale(0.95); }
        #enterBtn { border-color: #00C851; color: #00C851; box-shadow: 0 0 15px rgba(0, 200, 81, 0.2); }
        #enterBtn:hover { background: rgba(0, 200, 81, 0.1); }
        #exitBtn { border-color: #ff4444; color: #ff4444; }
        
        /* In-Game HUD */
        #gameUI { 
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            font-size: 22px; font-weight: bold; pointer-events: none; display: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hud-box { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        #scoreDisplay { color: #00C851; }
        #highScoreDisplay { color: #ffbb33; }
        
        #exitScreen { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    </style>
</head>
<body>
    
    <!-- Main Menu -->
    <div id="menu">
        <h1 id="menuTitle">রাজাকার নিধন</h1>
        <p id="menuSubtitle">Tap to shoot. Survive.</p>
        <button id="enterBtn" class="btn">Start Game</button>
        <button id="exitBtn" class="btn">Exit</button>
    </div>

    <div id="exitScreen">
        <h2 style="color: #ff4444;">Mission Aborted</h2>
        <p>You can safely close this tab.</p>
    </div>

    <!-- Gameplay HUD -->
    <div id="gameUI">
        <div class="hud-box">Score: <span id="scoreEl">0</span></div>
        <div class="hud-box">High: <span id="highScoreEl">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const gameUI = document.getElementById('gameUI');
        const scoreEl = document.getElementById('scoreEl');
        const highScoreEl = document.getElementById('highScoreEl');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let highScore = localStorage.getItem('rajakarHighScore') || 0;
        highScoreEl.innerText = highScore;
        
        let animationId, spawnInterval;
        let isPlaying = false;
        let lastTapAngle = 0;
        let enemySpawnRate = 1200; // Starting difficulty

        // Audio System (Synthesized Retro Sounds)
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'gameover') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1);
                osc.start(now); osc.stop(now + 1);
            }
        }

        // Classes
        class Player {
            constructor(x, y, radius, color) { this.x = x; this.y = y; this.radius = radius; this.color = color; }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(lastTapAngle);
                
                // Gun details
                ctx.fillStyle = '#666';
                ctx.fillRect(0, -6, 35, 12);
                ctx.fillStyle = '#333';
                ctx.fillRect(25, -4, 15, 8);
                ctx.restore();

                // Player body with glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0; // reset
            }
        }

        class Projectile {
            constructor(x, y, radius, color, velocity) {
                this.x = x; this.y = y; this.radius = radius; this.color = color; this.velocity = velocity;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 10;
                ctx.fill(); ctx.shadowBlur = 0;
            }
            update() { this.draw(); this.x += this.velocity.x; this.y += this.velocity.y; }
        }

        class Enemy {
            constructor(x, y, radius, color, velocity) {
                this.x = x; this.y = y; this.radius = radius; this.color = color; this.velocity = velocity;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color; ctx.shadowColor = 'red'; ctx.shadowBlur = 15;
                ctx.fill(); ctx.shadowBlur = 0;
                
                ctx.fillStyle = "white"; ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("রাজাকার", this.x, this.y);
            }
            update() { this.draw(); this.x += this.velocity.x; this.y += this.velocity.y; }
        }

        // Particle System for Explosions
        class Particle {
            constructor(x, y, radius, color, velocity) {
                this.x = x; this.y = y; this.radius = radius; this.color = color; this.velocity = velocity; this.alpha = 1;
            }
            draw() {
                ctx.save(); ctx.globalAlpha = this.alpha;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color; ctx.fill(); ctx.restore();
            }
            update() {
                this.draw();
                this.velocity.x *= 0.98; this.velocity.y *= 0.98; // Friction
                this.x += this.velocity.x; this.y += this.velocity.y;
                this.alpha -= 0.02; // Fade out
            }
        }

        let player = new Player(canvas.width / 2, canvas.height / 2, 18, '#00C851');
        let projectiles = []; let enemies = []; let particles = [];

        function init() {
            player = new Player(canvas.width / 2, canvas.height / 2, 18, '#00C851');
            projectiles = []; enemies = []; particles = [];
            score = 0; enemySpawnRate = 1200;
            scoreEl.innerHTML = score; lastTapAngle = 0;
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(x, y, Math.random() * 3, color, {
                    x: (Math.random() - 0.5) * (Math.random() * 8),
                    y: (Math.random() - 0.5) * (Math.random() * 8)
                }));
            }
        }

        function spawnEnemies() {
            spawnInterval = setInterval(() => {
                const radius = 28;
                let ex, ey;
                if (Math.random() < 0.5) {
                    ex = Math.random() < 0.5 ? 0 - radius : canvas.width + radius; ey = Math.random() * canvas.height;
                } else {
                    ex = Math.random() * canvas.width; ey = Math.random() < 0.5 ? 0 - radius : canvas.height + radius;
                }
                
                const angle = Math.atan2(canvas.height / 2 - ey, canvas.width / 2 - ex);
                // Speed scales slightly with score to increase difficulty
                const speedMulti = 1 + (score * 0.002);
                const velocity = { x: Math.cos(angle) * (1.2 * speedMulti), y: Math.sin(angle) * (1.2 * speedMulti) }; 
                enemies.push(new Enemy(ex, ey, radius, '#8b0000', velocity));
            }, enemySpawnRate);
        }

        window.addEventListener('pointerdown', (event) => {
            if (!isPlaying) return;
            initAudio();
            lastTapAngle = Math.atan2(event.clientY - canvas.height / 2, event.clientX - canvas.width / 2);
            const velocity = { x: Math.cos(lastTapAngle) * 10, y: Math.sin(lastTapAngle) * 10 };
            projectiles.push(new Projectile(canvas.width / 2, canvas.height / 2, 4, '#ffff00', velocity));
            playSound('shoot');
        });

        function animate() {
            if (!isPlaying) return;
            animationId = requestAnimationFrame(animate);
            
            // Motion blur effect background
            ctx.fillStyle = 'rgba(10, 10, 10, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            player.draw();

            // Update particles
            particles.forEach((particle, index) => {
                if (particle.alpha <= 0) particles.splice(index, 1);
                else particle.update();
            });

            // Update bullets
            projectiles.forEach((projectile, index) => {
                projectile.update();
                if (projectile.x < 0 || projectile.x > canvas.width || projectile.y < 0 || projectile.y > canvas.height) {
                    setTimeout(() => projectiles.splice(index, 1), 0);
                }
            });

            // Update enemies & Collisions
            enemies.forEach((enemy, index) => {
                enemy.update();
                
                // Game Over
                if (Math.hypot(player.x - enemy.x, player.y - enemy.y) - enemy.radius - player.radius < 1) { 
                    cancelAnimationFrame(animationId);
                    clearInterval(spawnInterval);
                    isPlaying = false;
                    playSound('gameover');
                    
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('rajakarHighScore', highScore);
                        highScoreEl.innerText = highScore;
                    }

                    menu.style.display = 'flex';
                    gameUI.style.display = 'none';
                    document.getElementById('menuTitle').innerText = 'Game Over';
                    document.getElementById('menuSubtitle').innerText = `Final Score: ${score}`;
                    document.getElementById('enterBtn').innerText = "Play Again";
                }

                // Bullet hits Enemy
                projectiles.forEach((projectile, pIndex) => {
                    if (Math.hypot(projectile.x - enemy.x, projectile.y - enemy.y) - enemy.radius - projectile.radius < 1) {
                        setTimeout(() => {
                            createParticles(enemy.x, enemy.y, enemy.color); // Explosion
                            playSound('explosion');
                            enemies.splice(index, 1);
                            projectiles.splice(pIndex, 1);
                            score += 10;
                            scoreEl.innerHTML = score;
                            
                            // Dynamically decrease spawn time (increase difficulty)
                            if (score % 100 === 0 && enemySpawnRate > 400) {
                                clearInterval(spawnInterval);
                                enemySpawnRate -= 100;
                                spawnEnemies();
                            }
                        }, 0);
                    }
                });
            });
        }

        // UI Controls
        document.getElementById('enterBtn').addEventListener('click', () => {
            initAudio();
            init();
            menu.style.display = 'none';
            gameUI.style.display = 'flex';
            isPlaying = true;
            animate();
            spawnEnemies();
        });

        document.getElementById('exitBtn').addEventListener('click', () => {
            menu.style.display = 'none';
            canvas.style.display = 'none';
            document.getElementById('exitScreen').style.display = 'block';
            isPlaying = false;
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(player) { player.x = canvas.width / 2; player.y = canvas.height / 2; }
        });
    </script>
</body>
</html>
