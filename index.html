<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>রাজাকার নিধন - V4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&display=swap');
        body { margin: 0; overflow: hidden; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }

        /* Updated Background */
        #mainMenu {
            background: linear-gradient(rgba(15, 0, 0, 0.75), rgba(0, 0, 0, 0.95)), url('ADDA585A-2372-48AA-AFF9-FF17B778D44A.png');
            background-size: cover;
            background-position: center;
        }

        #shopMenu { background: radial-gradient(circle, rgba(30,0,0,0.95) 0%, rgba(0,0,0,1) 100%); }
        .hidden { display: none !important; }
        
        h1 { font-family: 'Teko', sans-serif; font-size: 85px; color: #ff1a1a; margin: 0; text-shadow: 0 0 30px #ff0000, 3px 3px 0px #4a0000; letter-spacing: 3px; text-transform: uppercase; }
        h2 { font-family: 'Teko', sans-serif; font-size: 35px; margin: 5px; color: #e6e6e6; letter-spacing: 1px; text-shadow: 2px 2px 4px #000; }
        
        .btn { background: rgba(20, 0, 0, 0.8); color: #fff; border: 2px solid #ff1a1a; padding: 15px 40px; font-size: 24px; margin: 12px; cursor: pointer; width: 280px; font-weight: bold; text-transform: uppercase; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3) inset, 0 5px 15px rgba(0,0,0,0.8); transition: all 0.3s ease; font-family: 'Teko', sans-serif; letter-spacing: 2px; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
        .btn:hover { background: #ff1a1a; color: #000; box-shadow: 0 0 30px rgba(255, 26, 26, 0.8); border-color: #fff; }
        .btn:active { transform: scale(0.95); }
        
        #gameUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .top-bar { display: flex; justify-content: space-between; padding: 15px 30px; text-shadow: 2px 2px 4px #000; font-size: 20px; font-weight: bold; }
        
        .bar-bg { width: 200px; height: 15px; background: rgba(0,0,0,0.8); border: 2px solid #333; margin-top: 5px; overflow: hidden; box-shadow: 0 0 10px #000; }
        #hpBar { width: 100%; height: 100%; background: linear-gradient(90deg, #8b0000, #ff1a1a); transition: width 0.2s; }
        #expBar { width: 0%; height: 100%; background: linear-gradient(90deg, #004d00, #00C851); transition: width 0.2s; }
        
        #comboDisplay { position: absolute; top: 80px; right: 30px; font-size: 40px; font-family: 'Teko'; color: #ffcc00; text-shadow: 0 0 10px #ffcc00, 2px 2px 0 #000; transition: transform 0.1s; }
        
        /* Mobile Controls */
        #mobileControls { position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px; background: rgba(255,0,0,0.05); border: 2px solid rgba(255,26,26,0.3); border-radius: 50%; display: none; pointer-events: auto; }
        #joystickKnob { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(255,26,26,0.5); border-radius: 50%; pointer-events: none; box-shadow: 0 0 15px rgba(255,0,0,0.5); }
        #dashBtn { position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px; background: rgba(0,200,81,0.5); border: 2px solid #00C851; border-radius: 50%; display: none; pointer-events: auto; color: white; font-weight: bold; line-height: 80px; text-align: center; }
        
        .upgrade-card { background: rgba(20,0,0,0.9); border: 1px solid #ff1a1a; padding: 20px; margin: 10px; text-align: center; width: 200px; display: inline-block; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        /* Screen Flash effect */
        #damageFlash { position: absolute; top:0; left:0; width:100%; height:100%; background: red; opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 5; }
    </style>
</head>
<body>
    <div id="damageFlash"></div>
    <!-- Main Menu -->
    <div id="mainMenu" class="overlay">
        <h1>রাজাকার নিধন</h1>
        <h2>V4: THE CHAOS UPDATE</h2>
        <p style="color:#ccc; max-width: 450px; text-align: center; font-size: 14px; background: rgba(0,0,0,0.6); padding: 10px; border-left: 3px solid #ff1a1a;">
            PC: W,A,S,D to move. SPACE to Dash. Mouse to Shoot.<br>Mobile: Left Joystick to move. Right Button to Dash. Tap to shoot.
        </p>
        <button class="btn" onclick="startGame()">Start Mission</button>
        <button class="btn" onclick="openShop()">Armory</button>
    </div>

    <!-- Shop / Upgrades -->
    <div id="shopMenu" class="overlay hidden">
        <h1 style="font-size: 60px;">ARMORY</h1>
        <h2>Intel Funds: <span id="shopCoins" style="color: #00C851;">0</span></h2>
        <div>
            <div class="upgrade-card">
                <h3 style="color:#fff; font-family: 'Teko'; font-size: 28px; margin:0;">Tactical Speed</h3>
                <button class="btn" style="width:100%; padding: 10px; font-size: 18px; margin:0;" onclick="buyUpgrade('speed')">Fund (50)</button>
            </div>
            <div class="upgrade-card">
                <h3 style="color:#fff; font-family: 'Teko'; font-size: 28px; margin:0;">Heavy Caliber</h3>
                <button class="btn" style="width:100%; padding: 10px; font-size: 18px; margin:0;" onclick="buyUpgrade('dmg')">Fund (100)</button>
            </div>
        </div>
        <button class="btn" style="margin-top: 30px;" onclick="closeShop()">Return to Base</button>
    </div>

    <!-- Game HUD -->
    <div id="gameUI" class="hidden">
        <div class="top-bar">
            <div>
                <div style="color: #ff1a1a;">INTEGRITY: <span id="hpText">100</span>%</div>
                <div class="bar-bg"><div id="hpBar"></div></div>
            </div>
            <div style="text-align: right;">
                <div style="color: #fff;">SCORE: <span id="scoreText" style="color:#ff1a1a;">0</span></div>
                <div style="color: #00C851;">RANK: <span id="lvlText">1</span></div>
                <div class="bar-bg" style="float: right;"><div id="expBar"></div></div>
            </div>
        </div>
        <div id="comboDisplay"></div>
        <div id="mobileControls"><div id="joystickKnob"></div></div>
        <div id="dashBtn">DASH</div>
    </div>

    <!-- Death Screen -->
    <div id="deathScreen" class="overlay hidden" style="background: rgba(20,0,0,0.95);">
        <h1 style="color: #ff0000; font-size: 90px;">M.I.A.</h1>
        <h2 id="finalScoreText">Score: 0</h2>
        <p id="fundsEarnedText" style="color: #00C851; font-size: 20px; font-weight: bold;"></p>
        <button class="btn" onclick="location.reload()">Deploy Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if(isMobile) {
            document.getElementById('mobileControls').style.display = 'block';
            document.getElementById('dashBtn').style.display = 'block';
        }

        let state = 'MENU';
        let coins = Number(localStorage.getItem('rn_coins')) || 0;
        let upgSpeed = Number(localStorage.getItem('rn_speed')) || 0;
        let upgDmg = Number(localStorage.getItem('rn_dmg')) || 0;
        document.getElementById('shopCoins').innerText = coins;

        let camera = { x: 0, y: 0 };
        let bullets = [], enemies = [], floatTexts = [], gems = [], powerups = [], particles = [];
        let combo = 0, comboTimer = 0;
        const comicWords = ["BAM!", "BOINK!", "WHACK!", "KAPOW!", "ZAP!", "OUCH!"];

        let keys = { w: false, a: false, s: false, d: false, ' ': false };
        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key.toLowerCase()) || e.key === ' ') keys[e.key.toLowerCase()] = true; if(e.key === ' ') dash(); });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase()) || e.key === ' ') keys[e.key.toLowerCase()] = false; });

        let aimAngle = 0;
        const joy = document.getElementById('mobileControls');
        const knob = document.getElementById('joystickKnob');
        const dashBtn = document.getElementById('dashBtn');
        let joyActive = false; let joyVec = { x: 0, y: 0 };
        
        joy.addEventListener('touchstart', handleJoy, {passive: false});
        joy.addEventListener('touchmove', handleJoy, {passive: false});
        joy.addEventListener('touchend', () => { joyActive = false; joyVec = {x:0, y:0}; knob.style.transform = `translate(0px, 0px)`; });
        dashBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dash(); });

        function handleJoy(e) {
            e.preventDefault(); joyActive = true;
            const rect = joy.getBoundingClientRect(); const touch = e.touches[0];
            let dx = touch.clientX - (rect.left + 65); let dy = touch.clientY - (rect.top + 65);
            const dist = Math.hypot(dx, dy); if(dist > 40) { dx = (dx/dist)*40; dy = (dy/dist)*40; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`; joyVec.x = dx / 40; joyVec.y = dy / 40;
        }

        window.addEventListener('pointermove', e => { if(!isMobile) aimAngle = Math.atan2((e.clientY + camera.y) - player.y, (e.clientX + camera.x) - player.x); });
        window.addEventListener('pointerdown', e => {
            if(state !== 'PLAY') return;
            if(e.target === joy || joy.contains(e.target) || e.target === dashBtn) return;
            if(isMobile) aimAngle = Math.atan2((e.clientY + camera.y) - player.y, (e.clientX + camera.x) - player.x);
            shoot();
        });

        const player = {
            x: 0, y: 0, radius: 20, baseSpeed: 5 + (upgSpeed * 0.5), speed: 5, hp: 100, maxHp: 100, exp: 0, maxExp: 50, lvl: 1, score: 0, dmg: 35 + (upgDmg * 15),
            isDashing: false, dashCooldown: 0, dashTimer: 0, shield: 0, rapidFire: 0, bigBullet: 0,
            draw() {
                ctx.save(); ctx.translate(this.x - camera.x, this.y - camera.y); ctx.rotate(aimAngle);
                
                // Draw shield if active
                if(this.shield > 0) {
                    ctx.beginPath(); ctx.arc(0, 0, this.radius + 10, 0, Math.PI*2);
                    ctx.fillStyle = `hsla(${Date.now() % 360}, 100%, 50%, 0.3)`; ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                }

                // Bigger gun if powerup active
                const gunSize = this.bigBullet > 0 ? 24 : 16;
                ctx.fillStyle = '#444'; ctx.fillRect(10, -gunSize/2, 35 + (this.rapidFire>0?10:0), gunSize); 
                ctx.fillStyle = '#111'; ctx.fillRect(40 + (this.rapidFire>0?10:0), -(gunSize/2 - 2), 10, gunSize-4);
                
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                ctx.fillStyle = this.isDashing ? '#00ffcc' : '#006a4e'; 
                ctx.shadowColor = '#000'; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0; ctx.restore();
            },
            update() {
                this.speed = this.baseSpeed;
                if(this.isDashing) { this.speed = this.baseSpeed * 4; this.dashTimer--; if(this.dashTimer <= 0) this.isDashing = false; }
                if(this.dashCooldown > 0) this.dashCooldown--;
                if(this.shield > 0) this.shield--;
                if(this.rapidFire > 0) { this.rapidFire--; if(this.rapidFire % 5 === 0) shoot(); }
                if(this.bigBullet > 0) this.bigBullet--;

                let vx = 0, vy = 0;
                if(keys.w) vy = -1; if(keys.s) vy = 1; if(keys.a) vx = -1; if(keys.d) vx = 1;
                if(joyActive) { vx = joyVec.x; vy = joyVec.y; }
                if(vx !== 0 && vy !== 0) { const norm = Math.hypot(vx, vy); vx /= norm; vy /= norm; }
                
                this.x += vx * this.speed; this.y += vy * this.speed;
                camera.x += (this.x - canvas.width/2 - camera.x) * 0.15;
                camera.y += (this.y - canvas.height/2 - camera.y) * 0.15;
                this.draw();
            }
        };

        function dash() {
            if(player.dashCooldown <= 0) { player.isDashing = true; player.dashTimer = 10; player.dashCooldown = 60; playSnd('dash'); }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type; this.spin = 0; this.wobble = Math.random() * 10;
                if(type === 'normal') { this.hp = 60; this.speed = 2.5; this.r = 22; this.color = '#8b0000'; this.txt = "রাজাকার"; }
                else if(type === 'fast') { this.hp = 30; this.speed = 4.5; this.r = 16; this.color = '#ff1a1a'; this.txt = "দোসর"; }
                else if(type === 'bounce') { this.hp = 45; this.speed = 3; this.r = 20; this.color = '#aa00ff'; this.txt = "লাফানো"; }
                else { this.hp = 250; this.speed = 1.2; this.r = 35; this.color = '#330000'; this.txt = "কমান্ডার"; }
            }
            draw() {
                const drawX = this.x - camera.x, drawY = this.y - camera.y;
                ctx.save(); ctx.translate(drawX, drawY); ctx.rotate(this.spin);
                ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI*2);
                ctx.fillStyle = this.color; ctx.shadowColor = '#000'; ctx.shadowBlur = 15; ctx.fill(); ctx.shadowBlur = 0;
                
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-15, -this.r - 12, 30, 6);
                ctx.fillStyle = '#ff1a1a'; ctx.fillRect(-15, -this.r - 12, 30 * (this.hp / (this.type==='tank'?250:this.type==='normal'?60:this.type==='bounce'?45:30)), 6);
                
                ctx.fillStyle = "white"; ctx.font = "bold 13px 'Segoe UI'"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(this.txt, 0, 0); ctx.restore();
            }
            update() {
                let angle = Math.atan2(player.y - this.y, player.x - this.x);
                if(this.type === 'bounce') { this.wobble += 0.2; angle += Math.sin(this.wobble) * 1.5; }
                if(this.spin > 0) this.spin -= 0.1; // funny spin slows down
                
                this.x += Math.cos(angle) * this.speed; this.y += Math.sin(angle) * this.speed;
                this.draw();
            }
        }

        class Powerup {
            constructor(x, y, type) { this.x = x; this.y = y; this.type = type; this.pulse = 0; }
            draw() {
                this.pulse += 0.1; const scale = 1 + Math.sin(this.pulse)*0.2;
                ctx.save(); ctx.translate(this.x - camera.x, this.y - camera.y); ctx.scale(scale, scale);
                ctx.fillStyle = this.type === 'rapid' ? '#ffaa00' : (this.type === 'shield' ? '#00ffff' : '#ff00ff');
                ctx.fillRect(-10, -10, 20, 20);
                ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('?', 0, 5);
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color) { this.x = x; this.y = y; this.text = text; this.color = color; this.life = 1.0; }
            update() {
                this.y -= 2; this.life -= 0.02;
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color; ctx.font = "bold 28px 'Teko'"; ctx.shadowColor = '#000'; ctx.shadowBlur = 4; 
                ctx.fillText(this.text, this.x - camera.x, this.y - camera.y);
                ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
            }
        }

        const A = new (window.AudioContext || window.webkitAudioContext)();
        function playSnd(t){ 
            if(A.state==='suspended')A.resume(); const o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination); const n=A.currentTime; 
            if(t==='sht'){ o.type='square';o.frequency.setValueAtTime(400,n);o.frequency.exponentialRampToValueAtTime(100,n+0.1);g.gain.setValueAtTime(0.08,n);g.gain.linearRampToValueAtTime(0,n+0.1);o.start(n);o.stop(n+0.1); }
            else if(t==='hit'){ o.type='sawtooth';o.frequency.setValueAtTime(150,n);o.frequency.exponentialRampToValueAtTime(20,n+0.2);g.gain.setValueAtTime(0.1,n);g.gain.linearRampToValueAtTime(0,n+0.2);o.start(n);o.stop(n+0.2); }
            else if(t==='dash'){ o.type='sine';o.frequency.setValueAtTime(300,n);o.frequency.linearRampToValueAtTime(800,n+0.15);g.gain.setValueAtTime(0.1,n);g.gain.linearRampToValueAtTime(0,n+0.15);o.start(n);o.stop(n+0.15); }
            else if(t==='power'){ o.type='triangle';o.frequency.setValueAtTime(400,n);o.frequency.linearRampToValueAtTime(1200,n+0.3);g.gain.setValueAtTime(0.2,n);g.gain.linearRampToValueAtTime(0,n+0.3);o.start(n);o.stop(n+0.3); }
        }

        function shoot() {
            const rad = player.bigBullet > 0 ? 12 : 4;
            const dmg = player.bigBullet > 0 ? player.dmg * 3 : player.dmg;
            bullets.push({ x: player.x, y: player.y, vx: Math.cos(aimAngle)*18, vy: Math.sin(aimAngle)*18, r: rad, dmg: dmg });
            playSnd('sht'); shake = player.bigBullet > 0 ? 8 : 4;
        }

        function addCombo() {
            combo++; comboTimer = 120;
            const disp = document.getElementById('comboDisplay');
            disp.innerText = combo > 1 ? `${combo}x COMBO!` : "";
            disp.style.transform = 'scale(1.5)';
            setTimeout(() => disp.style.transform = 'scale(1)', 100);
        }

        let spawnTimer = 0; let shake = 0;
        function updateGame() {
            if(state !== 'PLAY') return;
            requestAnimationFrame(updateGame);
            
            if(comboTimer > 0) { comboTimer--; if(comboTimer <= 0) { combo = 0; document.getElementById('comboDisplay').innerText = ""; } }
            let cx = 0, cy = 0; if(shake > 0) { cx = (Math.random()-0.5)*shake; cy = (Math.random()-0.5)*shake; shake -= 0.3; }
            
            // Dynamic Grid Background changes color with combo
            ctx.fillStyle = '#0f1110'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = combo > 10 ? `hsla(${Date.now()%360}, 100%, 50%, 0.1)` : 'rgba(0,200,81,0.03)'; ctx.lineWidth = 2;
            const gs = 80; const offsetX = (camera.x + cx) % gs; const offsetY = (camera.y + cy) % gs;
            ctx.beginPath();
            for(let x = -offsetX; x < canvas.width; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
            for(let y = -offsetY; y < canvas.height; y += gs) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
            ctx.stroke();

            ctx.save(); ctx.translate(cx, cy); 
            
            player.update();

            // Powerups
            for(let i=powerups.length-1; i>=0; i--) {
                const p = powerups[i]; p.draw();
                if(Math.hypot(player.x - p.x, player.y - p.y) < player.radius + 15) {
                    if(p.type === 'rapid') player.rapidFire = 300;
                    if(p.type === 'shield') player.shield = 400;
                    if(p.type === 'big') player.bigBullet = 300;
                    playSnd('power'); powerups.splice(i, 1);
                    floatTexts.push(new FloatingText(player.x, player.y-30, "POWER UP!", "#ffaa00"));
                }
            }

            // Gems
            for(let i=gems.length-1; i>=0; i--) {
                const g = gems[i];
                ctx.fillStyle = '#00C851'; ctx.beginPath(); ctx.arc(g.x - camera.x, g.y - camera.y, 6, 0, Math.PI*2); ctx.fill();
                const dist = Math.hypot(player.x - g.x, player.y - g.y);
                if(dist < 150) { g.x += (player.x - g.x)*0.2; g.y += (player.y - g.y)*0.2; }
                if(dist < player.radius + 6) {
                    player.exp += 10; gems.splice(i, 1);
                    if(player.exp >= player.maxExp) { 
                        player.lvl++; player.exp = 0; player.maxExp *= 1.5; player.maxHp += 20; player.hp = player.maxHp; 
                        floatTexts.push(new FloatingText(player.x, player.y - 40, "RANK UP!", "#00ff66")); 
                    }
                    updateHUD();
                }
            }

            // Bullets
            for(let i=bullets.length-1; i>=0; i--) {
                const b = bullets[i]; b.x += b.vx; b.y += b.vy;
                ctx.fillStyle = '#ffcc00'; ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(b.x - camera.x, b.y - camera.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                if(Math.hypot(b.x - player.x, b.y - player.y) > 1500) bullets.splice(i, 1);
            }

            spawnTimer++;
            if(spawnTimer > Math.max(20, 80 - (player.lvl * 3))) {
                const ang = Math.random() * Math.PI * 2; const dist = Math.max(canvas.width, canvas.height) / 1.2;
                const r = Math.random(); const type = r > 0.8 ? 'tank' : (r > 0.6 ? 'fast' : (r > 0.4 ? 'bounce' : 'normal'));
                enemies.push(new Enemy(player.x + Math.cos(ang)*dist, player.y + Math.sin(ang)*dist, type));
                spawnTimer = 0;
            }

            for(let i=enemies.length-1; i>=0; i--) {
                const e = enemies[i]; e.update();
                
                // Player hit
                if(Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.r && !player.isDashing && player.shield <= 0) {
                    player.hp -= (e.type==='tank' ? 4 : 1); shake = 10; combo = 0; updateHUD();
                    document.getElementById('damageFlash').style.opacity = '0.5';
                    setTimeout(() => document.getElementById('damageFlash').style.opacity = '0', 100);
                    if(player.hp <= 0) die();
                }

                for(let j=bullets.length-1; j>=0; j--) {
                    const b = bullets[j];
                    if(Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
                        e.hp -= b.dmg; e.spin = 10; // Funny spin
                        if(player.bigBullet <= 0) bullets.splice(j, 1); // Big bullets pierce through
                        playSnd('hit');
                        
                        let hitWord = comicWords[Math.floor(Math.random()*comicWords.length)];
                        floatTexts.push(new FloatingText(e.x + (Math.random()*20-10), e.y - 20, Math.random()>0.5 ? hitWord : b.dmg, "#fff"));
                        
                        if(e.hp <= 0) {
                            addCombo();
                            player.score += (e.type==='tank' ? 5 : 1) * (1 + Math.floor(combo/10));
                            gems.push({x: e.x, y: e.y});
                            if(Math.random() > 0.95) { // 5% chance to drop powerup
                                const pType = Math.random() > 0.6 ? 'rapid' : (Math.random() > 0.5 ? 'shield' : 'big');
                                powerups.push(new Powerup(e.x, e.y, pType));
                            }
                            enemies.splice(i, 1); updateHUD();
                            break;
                        }
                    }
                }
            }

            for(let i=floatTexts.length-1; i>=0; i--) {
                floatTexts[i].update();
                if(floatTexts[i].life <= 0) floatTexts.splice(i, 1);
            }
            ctx.restore();
        }

        function updateHUD() {
            document.getElementById('hpText').innerText = Math.max(0, Math.floor(player.hp));
            document.getElementById('hpBar').style.width = Math.max(0, (player.hp / player.maxHp * 100)) + '%';
            document.getElementById('scoreText').innerText = player.score;
            document.getElementById('lvlText').innerText = player.lvl;
            document.getElementById('expBar').style.width = (player.exp / player.maxExp * 100) + '%';
        }

        function startGame() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameUI').classList.remove('hidden');
            state = 'PLAY'; player.hp = player.maxHp; player.score = 0; combo = 0;
            player.x = 0; player.y = 0; camera = {x: -canvas.width/2, y: -canvas.height/2};
            updateHUD(); updateGame();
        }

        function die() {
            state = 'DEAD';
            const earned = Math.floor(player.score * 2);
            coins += earned;
            localStorage.setItem('rn_coins', coins);
            document.getElementById('gameUI').classList.add('hidden');
            document.getElementById('deathScreen').classList.remove('hidden');
            document.getElementById('finalScoreText').innerText = `Score: ${player.score}`;
            document.getElementById('fundsEarnedText').innerText = `+${earned} Intel Funds`;
        }

        function openShop() { document.getElementById('mainMenu').classList.add('hidden'); document.getElementById('shopMenu').classList.remove('hidden'); }
        function closeShop() { document.getElementById('shopMenu').classList.add('hidden'); document.getElementById('mainMenu').classList.remove('hidden'); }
        function buyUpgrade(type) {
            const cost = type === 'speed' ? 50 : 100;
            if(coins >= cost) {
                coins -= cost; localStorage.setItem('rn_coins', coins); document.getElementById('shopCoins').innerText = coins;
                if(type === 'speed') { upgSpeed++; localStorage.setItem('rn_speed', upgSpeed); player.baseSpeed = 5 + (upgSpeed*0.5); }
                if(type === 'dmg') { upgDmg++; localStorage.setItem('rn_dmg', upgDmg); player.dmg = 35 + (upgDmg*15); }
                alert("Tactical Gear Acquired.");
            } else alert("Insufficient Intel Funds.");
        }

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
</html>
