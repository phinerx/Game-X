<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>রাজাকার নিধন - V2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&display=swap');
        body { margin: 0; overflow: hidden; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }
        
        /* Menus */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(20,0,0,0.8) 0%, rgba(0,0,0,0.95) 100%); z-index: 20; backdrop-filter: blur(8px); }
        .hidden { display: none !important; }
        h1 { font-family: 'Teko', sans-serif; font-size: 70px; color: #ff3333; margin: 0; text-shadow: 0 0 20px red, 2px 2px 0px #fff; letter-spacing: 2px; }
        h2 { font-family: 'Teko', sans-serif; font-size: 40px; margin: 5px; color: #ffcc00; }
        
        .btn { background: linear-gradient(45deg, #222, #111); color: white; border: 2px solid rgba(255,255,255,0.2); padding: 15px 40px; font-size: 22px; margin: 10px; cursor: pointer; border-radius: 12px; width: 250px; font-weight: bold; text-transform: uppercase; box-shadow: 0 5px 15px rgba(0,0,0,0.8); transition: 0.2s; font-family: 'Teko', sans-serif; letter-spacing: 1px; }
        .btn:hover { border-color: #00C851; box-shadow: 0 0 20px rgba(0, 200, 81, 0.4); }
        .btn:active { transform: scale(0.95); }
        
        /* HUD UI */
        #gameUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .top-bar { display: flex; justify-content: space-between; padding: 15px 30px; text-shadow: 2px 2px 4px #000; font-size: 20px; font-weight: bold; }
        
        /* RPG Bars */
        .bar-bg { width: 200px; height: 15px; background: rgba(0,0,0,0.6); border: 2px solid #555; border-radius: 10px; margin-top: 5px; overflow: hidden; }
        #hpBar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0000, #ff4444); transition: width 0.2s; }
        #expBar { width: 0%; height: 100%; background: linear-gradient(90deg, #00C851, #00ff66); transition: width 0.2s; }
        
        /* Mobile Controls */
        #mobileControls { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; display: none; pointer-events: auto; }
        #joystickKnob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.3); border-radius: 50%; pointer-events: none; }
        
        .upgrade-card { background: rgba(0,0,0,0.8); border: 1px solid #444; padding: 20px; margin: 10px; border-radius: 10px; text-align: center; width: 200px; display: inline-block; }
    </style>
</head>
<body>

    <!-- Main Menu -->
    <div id="mainMenu" class="overlay">
        <h1>রাজাকার নিধন</h1>
        <h2>V2.0: The Ultimate Battle</h2>
        <p style="color:#aaa; max-width: 400px; text-align: center;">PC: Use W,A,S,D to move. Mouse to Aim & Shoot.<br>Mobile: Use Left Joystick to move. Tap screen to shoot.</p>
        <button class="btn" onclick="startGame()">Start Mission</button>
        <button class="btn" onclick="openShop()">Upgrades</button>
    </div>

    <!-- Shop / Upgrades -->
    <div id="shopMenu" class="overlay hidden">
        <h1>ARMORY</h1>
        <h2>Coins: <span id="shopCoins" style="color: gold;">0</span></h2>
        <div>
            <div class="upgrade-card">
                <h3 style="color:#00C851">Speed</h3>
                <p>Move faster</p>
                <button class="btn" style="width:100%; padding: 10px;" onclick="buyUpgrade('speed')">Buy (50)</button>
            </div>
            <div class="upgrade-card">
                <h3 style="color:#ffcc00">Damage</h3>
                <p>Hit harder</p>
                <button class="btn" style="width:100%; padding: 10px;" onclick="buyUpgrade('dmg')">Buy (100)</button>
            </div>
        </div>
        <button class="btn" style="margin-top: 30px;" onclick="closeShop()">Back</button>
    </div>

    <!-- Game HUD -->
    <div id="gameUI" class="hidden">
        <div class="top-bar">
            <div>
                <div style="color: #ff4444;">HP: <span id="hpText">100</span>/100</div>
                <div class="bar-bg"><div id="hpBar"></div></div>
            </div>
            <div>
                <div style="color: gold;">Score: <span id="scoreText">0</span></div>
                <div style="color: #00C851;">LVL: <span id="lvlText">1</span></div>
                <div class="bar-bg"><div id="expBar"></div></div>
            </div>
        </div>
        <div id="mobileControls">
            <div id="joystickKnob"></div>
        </div>
    </div>

    <!-- Death Screen -->
    <div id="deathScreen" class="overlay hidden">
        <h1 style="color: darkred;">MARTYRED</h1>
        <h2 id="finalScoreText">Score: 0</h2>
        <button class="btn" onclick="location.reload()">Restart</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Detect Mobile for UI
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if(isMobile) document.getElementById('mobileControls').style.display = 'block';

        // --- GAME STATE & STATS ---
        let state = 'MENU';
        let coins = Number(localStorage.getItem('rn_coins')) || 0;
        let upgSpeed = Number(localStorage.getItem('rn_speed')) || 0;
        let upgDmg = Number(localStorage.getItem('rn_dmg')) || 0;
        
        document.getElementById('shopCoins').innerText = coins;

        // --- CAMERA SYSTEM (2D Free Roam) ---
        let camera = { x: 0, y: 0 };

        // --- ENTITY ARRAYS ---
        let bullets = [], enemies = [], particles = [], floatTexts = [], gems = [];

        // --- INPUT HANDLING ---
        let keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        let aimAngle = 0;
        let isShooting = false;

        // Mobile Joystick Logic
        const joy = document.getElementById('mobileControls');
        const knob = document.getElementById('joystickKnob');
        let joyActive = false; let joyVec = { x: 0, y: 0 };
        
        joy.addEventListener('touchstart', handleJoy, {passive: false});
        joy.addEventListener('touchmove', handleJoy, {passive: false});
        joy.addEventListener('touchend', () => { joyActive = false; joyVec = {x:0, y:0}; knob.style.transform = `translate(0px, 0px)`; });

        function handleJoy(e) {
            e.preventDefault();
            joyActive = true;
            const rect = joy.getBoundingClientRect();
            const touch = e.touches[0];
            let dx = touch.clientX - (rect.left + 60);
            let dy = touch.clientY - (rect.top + 60);
            const dist = Math.hypot(dx, dy);
            if(dist > 35) { dx = (dx/dist)*35; dy = (dy/dist)*35; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyVec.x = dx / 35; joyVec.y = dy / 35;
        }

        // Aim & Shoot (Mouse/Touch)
        window.addEventListener('pointermove', e => {
            if(!isMobile) {
                aimAngle = Math.atan2((e.clientY + camera.y) - player.y, (e.clientX + camera.x) - player.x);
            }
        });
        window.addEventListener('pointerdown', e => {
            if(state !== 'PLAY') return;
            if(e.target === joy || joy.contains(e.target)) return; // Don't shoot if using joystick
            isShooting = true;
            if(isMobile) aimAngle = Math.atan2((e.clientY + camera.y) - player.y, (e.clientX + camera.x) - player.x);
            shoot();
        });

        // --- CLASSES ---
        const player = {
            x: 0, y: 0, radius: 20, speed: 4 + (upgSpeed * 0.5), hp: 100, maxHp: 100, exp: 0, maxExp: 50, lvl: 1, score: 0, dmg: 25 + (upgDmg * 10),
            draw() {
                ctx.save();
                ctx.translate(this.x - camera.x, this.y - camera.y);
                ctx.rotate(aimAngle);
                
                // Gun
                ctx.fillStyle = '#777'; ctx.fillRect(10, -8, 30, 16);
                ctx.fillStyle = '#222'; ctx.fillRect(35, -5, 10, 10);
                
                // Body
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                ctx.fillStyle = '#006a4e'; ctx.shadowColor = '#00ff66'; ctx.shadowBlur = 15;
                ctx.fill(); ctx.shadowBlur = 0; ctx.restore();
            },
            update() {
                // Movement Math
                let vx = 0, vy = 0;
                if(keys.w) vy = -1; if(keys.s) vy = 1; if(keys.a) vx = -1; if(keys.d) vx = 1;
                if(joyActive) { vx = joyVec.x; vy = joyVec.y; }
                
                if(vx !== 0 && vy !== 0) { const norm = Math.hypot(vx, vy); vx /= norm; vy /= norm; }
                
                this.x += vx * this.speed; this.y += vy * this.speed;

                // Camera follows player smoothly
                camera.x += (this.x - canvas.width/2 - camera.x) * 0.1;
                camera.y += (this.y - canvas.height/2 - camera.y) * 0.1;

                this.draw();
            }
        };

        class Enemy {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                if(type === 'normal') { this.hp = 50; this.speed = 2; this.r = 22; this.color = '#8b0000'; this.txt = "রাজাকার"; }
                else if(type === 'fast') { this.hp = 25; this.speed = 3.5; this.r = 16; this.color = '#ff4444'; this.txt = "দোসর"; }
                else { this.hp = 150; this.speed = 1; this.r = 35; this.color = '#4a0000'; this.txt = "কমান্ডার"; } // tank
            }
            draw() {
                const drawX = this.x - camera.x, drawY = this.y - camera.y;
                ctx.beginPath(); ctx.arc(drawX, drawY, this.r, 0, Math.PI*2);
                ctx.fillStyle = this.color; ctx.shadowColor = 'red'; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
                
                // HP Bar
                ctx.fillStyle = 'red'; ctx.fillRect(drawX - 15, drawY - this.r - 10, 30 * (this.hp / (this.type==='tank'?150:this.type==='fast'?25:50)), 4);
                
                ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(this.txt, drawX, drawY);
            }
            update() {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * this.speed; this.y += Math.sin(angle) * this.speed;
                this.draw();
            }
        }

        class FloatingText {
            constructor(x, y, text, color) { this.x = x; this.y = y; this.text = text; this.color = color; this.life = 1.0; }
            update() {
                this.y -= 1; this.life -= 0.02;
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color; ctx.font = "bold 20px 'Teko'"; ctx.fillText(this.text, this.x - camera.x, this.y - camera.y);
                ctx.globalAlpha = 1.0;
            }
        }

        // --- AUDIO ENGINE ---
        const A = new (window.AudioContext || window.webkitAudioContext)();
        function playSnd(t){ if(A.state==='suspended')A.resume(); const o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination); const n=A.currentTime; if(t==='sht'){o.type='square';o.frequency.setValueAtTime(800,n);o.frequency.exponentialRampToValueAtTime(100,n+0.1);g.gain.setValueAtTime(0.05,n);g.gain.linearRampToValueAtTime(0,n+0.1);o.start(n);o.stop(n+0.1);}else if(t==='hit'){o.type='sawtooth';o.frequency.setValueAtTime(150,n);o.frequency.exponentialRampToValueAtTime(10,n+0.2);g.gain.setValueAtTime(0.1,n);g.gain.linearRampToValueAtTime(0,n+0.2);o.start(n);o.stop(n+0.2);}else{o.type='sine';o.frequency.setValueAtTime(600,n);o.frequency.linearRampToValueAtTime(1200,n+0.1);g.gain.setValueAtTime(0.1,n);g.gain.linearRampToValueAtTime(0,n+0.3);o.start(n);o.stop(n+0.3);} }

        function shoot() {
            bullets.push({ x: player.x, y: player.y, vx: Math.cos(aimAngle)*15, vy: Math.sin(aimAngle)*15 });
            playSnd('sht');
            // Screen Shake trigger
            shake = 3;
        }

        // --- GAME LOOP ---
        let spawnTimer = 0; let shake = 0;
        function updateGame() {
            if(state !== 'PLAY') return;
            requestAnimationFrame(updateGame);
            
            // Screen Shake Math
            let cx = 0, cy = 0;
            if(shake > 0) { cx = (Math.random()-0.5)*shake; cy = (Math.random()-0.5)*shake; shake -= 0.2; }
            
            ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw Infinite Grid Background
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
            const gs = 100; // grid size
            const offsetX = (camera.x + cx) % gs; const offsetY = (camera.y + cy) % gs;
            ctx.beginPath();
            for(let x = -offsetX; x < canvas.width; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
            for(let y = -offsetY; y < canvas.height; y += gs) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
            ctx.stroke();

            ctx.save(); ctx.translate(cx, cy); // Apply shake
            
            player.update();

            // Gems (EXP)
            for(let i=gems.length-1; i>=0; i--) {
                const g = gems[i];
                ctx.fillStyle = '#00C851'; ctx.beginPath(); ctx.arc(g.x - camera.x, g.y - camera.y, 6, 0, Math.PI*2); ctx.fill();
                // Magnet effect
                const dist = Math.hypot(player.x - g.x, player.y - g.y);
                if(dist < 100) { g.x += (player.x - g.x)*0.1; g.y += (player.y - g.y)*0.1; }
                if(dist < player.radius + 6) {
                    player.exp += 10; gems.splice(i, 1); playSnd('gem');
                    if(player.exp >= player.maxExp) { player.lvl++; player.exp = 0; player.maxExp *= 1.5; player.maxHp += 20; player.hp = player.maxHp; floatTexts.push(new FloatingText(player.x, player.y - 30, "LEVEL UP!", "#00ff66")); }
                    updateHUD();
                }
            }

            // Bullets
            for(let i=bullets.length-1; i>=0; i--) {
                const b = bullets[i]; b.x += b.vx; b.y += b.vy;
                ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(b.x - camera.x, b.y - camera.y, 5, 0, Math.PI*2); ctx.fill();
                if(Math.hypot(b.x - player.x, b.y - player.y) > 2000) bullets.splice(i, 1); // Delete far bullets
            }

            // Enemies & Collisions
            spawnTimer++;
            if(spawnTimer > Math.max(30, 100 - (player.lvl * 5))) {
                const ang = Math.random() * Math.PI * 2; const dist = Math.max(canvas.width, canvas.height) / 1.5;
                const r = Math.random(); const type = r > 0.9 ? 'tank' : (r > 0.6 ? 'fast' : 'normal');
                enemies.push(new Enemy(player.x + Math.cos(ang)*dist, player.y + Math.sin(ang)*dist, type));
                spawnTimer = 0;
            }

            for(let i=enemies.length-1; i>=0; i--) {
                const e = enemies[i]; e.update();
                
                // Enemy hits player
                if(Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.r) {
                    player.hp -= (e.type==='tank' ? 2 : 0.5); shake = 5; updateHUD();
                    if(player.hp <= 0) die();
                }

                // Bullet hits Enemy
                for(let j=bullets.length-1; j>=0; j--) {
                    const b = bullets[j];
                    if(Math.hypot(b.x - e.x, b.y - e.y) < e.r + 5) {
                        e.hp -= player.dmg; bullets.splice(j, 1); playSnd('hit');
                        floatTexts.push(new FloatingText(e.x + (Math.random()*20-10), e.y - 20, player.dmg, "#fff"));
                        if(e.hp <= 0) {
                            player.score += (e.type==='tank' ? 50 : 10);
                            gems.push({x: e.x, y: e.y});
                            enemies.splice(i, 1); updateHUD();
                            break;
                        }
                    }
                }
            }

            // Float Texts
            for(let i=floatTexts.length-1; i>=0; i--) {
                floatTexts[i].update();
                if(floatTexts[i].life <= 0) floatTexts.splice(i, 1);
            }

            ctx.restore();
        }

        // --- GAME LOGIC ---
        function updateHUD() {
            document.getElementById('hpText').innerText = Math.floor(player.hp);
            document.getElementById('hpBar').style.width = (player.hp / player.maxHp * 100) + '%';
            document.getElementById('scoreText').innerText = player.score;
            document.getElementById('lvlText').innerText = player.lvl;
            document.getElementById('expBar').style.width = (player.exp / player.maxExp * 100) + '%';
        }

        function startGame() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameUI').classList.remove('hidden');
            state = 'PLAY'; player.hp = player.maxHp; player.score = 0;
            player.x = 0; player.y = 0; camera = {x: -canvas.width/2, y: -canvas.height/2};
            updateHUD(); updateGame();
        }

        function die() {
            state = 'DEAD';
            coins += Math.floor(player.score / 10);
            localStorage.setItem('rn_coins', coins);
            document.getElementById('gameUI').classList.add('hidden');
            document.getElementById('deathScreen').classList.remove('hidden');
            document.getElementById('finalScoreText').innerText = `Score: ${player.score} | Coins Earned: ${Math.floor(player.score / 10)}`;
        }

        // --- SHOP ---
        function openShop() { document.getElementById('mainMenu').classList.add('hidden'); document.getElementById('shopMenu').classList.remove('hidden'); }
        function closeShop() { document.getElementById('shopMenu').classList.add('hidden'); document.getElementById('mainMenu').classList.remove('hidden'); }
        function buyUpgrade(type) {
            const cost = type === 'speed' ? 50 : 100;
            if(coins >= cost) {
                coins -= cost; localStorage.setItem('rn_coins', coins); document.getElementById('shopCoins').innerText = coins;
                if(type === 'speed') { upgSpeed++; localStorage.setItem('rn_speed', upgSpeed); player.speed = 4 + (upgSpeed*0.5); }
                if(type === 'dmg') { upgDmg++; localStorage.setItem('rn_dmg', upgDmg); player.dmg = 25 + (upgDmg*10); }
                alert("Upgraded successfully!");
            } else alert("Not enough coins! Play matches to earn coins.");
        }

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
</html>
