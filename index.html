<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <!-- Prevents zooming on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>রাজাকার নিধন</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; color: white; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* Menu UI */
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.85); z-index: 10;
        }
        #menu h1 { font-size: 40px; color: #ff4d4d; margin-bottom: 40px; text-shadow: 2px 2px 0 #000; text-align: center; }
        .btn {
            background: #222; color: white; border: 2px solid white; padding: 15px 40px;
            font-size: 20px; margin: 10px; cursor: pointer; border-radius: 5px; width: 200px; font-weight: bold;
        }
        .btn:active { background: #555; }
        #enterBtn { border-color: #4CAF50; color: #4CAF50; }
        #exitBtn { border-color: #f44336; color: #f44336; }
        
        /* Game UI */
        #gameUI { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; pointer-events: none; display: none; }
        #exitScreen { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    </style>
</head>
<body>
    
    <!-- Main Menu -->
    <div id="menu">
        <h1>রাজাকার নিধন</h1>
        <button id="enterBtn" class="btn">Enter (Play)</button>
        <button id="exitBtn" class="btn">Exit</button>
    </div>

    <div id="exitScreen">
        <h2>Game Exited.</h2>
        <p>You can close this tab.</p>
    </div>

    <!-- Gameplay -->
    <div id="gameUI">Score: <span id="scoreEl">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const gameUI = document.getElementById('gameUI');
        const exitScreen = document.getElementById('exitScreen');
        const scoreEl = document.getElementById('scoreEl');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let animationId;
        let spawnInterval;
        let isPlaying = false;
        let lastTapAngle = 0;

        // Player (The Gunner)
        class Player {
            constructor(x, y, radius, color) {
                this.x = x; this.y = y; this.radius = radius; this.color = color;
            }
            draw() {
                // Draw the gun barrel pointing to the last tap
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(lastTapAngle);
                ctx.fillStyle = '#888';
                ctx.fillRect(0, -5, 30, 10); // Gun barrel
                ctx.restore();

                // Draw the player body
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // Bullets
        class Projectile {
            constructor(x, y, radius, color, velocity) {
                this.x = x; this.y = y; this.radius = radius; this.color = color; this.velocity = velocity;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                this.draw();
                this.x += this.velocity.x;
                this.y += this.velocity.y;
            }
        }

        // Enemies (Rajakars)
        class Enemy {
            constructor(x, y, radius, color, velocity) {
                this.x = x; this.y = y; this.radius = radius; this.color = color; this.velocity = velocity;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // Add "রাজাকার" text
                ctx.fillStyle = "white";
                ctx.font = "12px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("রাজাকার", this.x, this.y);
            }
            update() {
                this.draw();
                this.x += this.velocity.x;
                this.y += this.velocity.y;
            }
        }

        let player = new Player(canvas.width / 2, canvas.height / 2, 15, '#006a4e'); // Bangladesh Green
        let projectiles = [];
        let enemies = [];

        function init() {
            player = new Player(canvas.width / 2, canvas.height / 2, 15, '#006a4e');
            projectiles = [];
            enemies = [];
            score = 0;
            scoreEl.innerHTML = score;
            lastTapAngle = 0;
        }

        function spawnEnemies() {
            spawnInterval = setInterval(() => {
                const radius = 25; // Made slightly bigger to fit text
                let ex, ey;
                
                if (Math.random() < 0.5) {
                    ex = Math.random() < 0.5 ? 0 - radius : canvas.width + radius;
                    ey = Math.random() * canvas.height;
                } else {
                    ex = Math.random() * canvas.width;
                    ey = Math.random() < 0.5 ? 0 - radius : canvas.height + radius;
                }
                
                const color = '#8b0000'; // Dark red
                const angle = Math.atan2(canvas.height / 2 - ey, canvas.width / 2 - ex);
                // Slightly slower for mobile gameplay
                const velocity = { x: Math.cos(angle) * 1.0, y: Math.sin(angle) * 1.0 }; 
                
                enemies.push(new Enemy(ex, ey, radius, color, velocity));
            }, 1200);
        }

        // Tap/Click to shoot
        window.addEventListener('pointerdown', (event) => {
            if (!isPlaying) return;
            
            lastTapAngle = Math.atan2(event.clientY - canvas.height / 2, event.clientX - canvas.width / 2);
            const velocity = { x: Math.cos(lastTapAngle) * 7, y: Math.sin(lastTapAngle) * 7 };
            
            projectiles.push(new Projectile(canvas.width / 2, canvas.height / 2, 5, '#ffcc00', velocity));
        });

        function animate() {
            if (!isPlaying) return;
            animationId = requestAnimationFrame(animate);
            
            ctx.fillStyle = 'rgba(17, 17, 17, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            player.draw();

            projectiles.forEach((projectile, index) => {
                projectile.update();
                if (projectile.x < 0 || projectile.x > canvas.width || projectile.y < 0 || projectile.y > canvas.height) {
                    setTimeout(() => projectiles.splice(index, 1), 0);
                }
            });

            enemies.forEach((enemy, index) => {
                enemy.update();
                
                const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (distToPlayer - enemy.radius - player.radius < 1) { 
                    cancelAnimationFrame(animationId);
                    clearInterval(spawnInterval);
                    isPlaying = false;
                    menu.style.display = 'flex';
                    gameUI.style.display = 'none';
                    document.querySelector('#menu h1').innerText = `Game Over!\nScore: ${score}`;
                    document.getElementById('enterBtn').innerText = "Play Again";
                }

                projectiles.forEach((projectile, pIndex) => {
                    const distToBullet = Math.hypot(projectile.x - enemy.x, projectile.y - enemy.y);
                    if (distToBullet - enemy.radius - projectile.radius < 1) {
                        setTimeout(() => {
                            enemies.splice(index, 1);
                            projectiles.splice(pIndex, 1);
                            score += 10;
                            scoreEl.innerHTML = score;
                        }, 0);
                    }
                });
            });
        }

        // Button Listeners
        document.getElementById('enterBtn').addEventListener('click', () => {
            init();
            menu.style.display = 'none';
            gameUI.style.display = 'block';
            isPlaying = true;
            animate();
            spawnEnemies();
        });

        document.getElementById('exitBtn').addEventListener('click', () => {
            menu.style.display = 'none';
            canvas.style.display = 'none';
            exitScreen.style.display = 'block';
            isPlaying = false;
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
        });
    </script>
</body>
</html>
